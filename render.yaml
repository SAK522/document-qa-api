# Render Blueprint: creates the web service and a PostgreSQL database and wires them together.
# In Render: New -> Blueprint -> select this repository.
# Runs in offline mode (hash embeddings + extractive answers) until you add LLM_* variables
# in the Render dashboard.
services:
  - type: web
    name: document-qa-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: document-qa-db
          property: connectionString
      - key: LLM_PROVIDER
        value: extractive
      - key: LLM_API_KEY
        sync: false        # set it in the dashboard if you switch LLM_PROVIDER to openai

databases:
  - name: document-qa-db
    plan: free
